<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge | Sneha Parmar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ide-sidebar">
        <div>📁</div>
        <div>🔍</div>
        <div>⚙️</div>
    </div>
    <div class="ide-file-tree">
        <p style="font-size: 11px; margin-bottom: 15px; letter-spacing: 1px;">EXPLORER</p>
        <p style="font-size: 13px;">index.js</p>
        <p style="font-size: 13px; color: #555;">App.py</p>
        <p style="font-size: 13px; color: #555;">styles.css</p>
    </div>
    <div class="ide-editor">
        <div class="tabs">
            <div class="tab">index.js</div>
        </div>
        <div class="code-area">
            <div><span class="keyword">function</span> <span class="function">innovate</span>() {</div>
            <div style="padding-left: 20px;"><span class="keyword">const</span> <span class="string">mission</span> = <span class="string">"Build the Future"</span>;</div>
            <div style="padding-left: 20px;"><span class="comment">// Executing core logic</span></div>
            <div style="padding-left: 20px;"><span class="keyword">return</span> <span class="string">`Sneha: ${mission}`</span>;</div>
            <div>}</div>
        </div>
    </div>
</body>
</html>
